
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | ShrinkingArena</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <div id="unity-fullscreen-container">
      <canvas
        id="unity-canvas"
        width="960"
        height="600"
        tabindex="-1">
      </canvas>

      <div id="unity-loading-container">
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">ShrinkingArena</div>
    </div>
  </div>

  <script>
    let canvas = document.querySelector("#unity-canvas");
    let fullscreenContainer =
      document.querySelector("#unity-fullscreen-container");

    function unityShowBanner(msg, type) {
      var warningBanner =
        document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    // Unity WebGL build directory
    var buildUrl = "Build";

    // Unity loader
    var loaderUrl = buildUrl + "/Build.loader.js";

    // Load uncompressed Unity WebGL files
    var config = {
      arguments: [],

      dataUrl: buildUrl + "/Build.data",

      frameworkUrl: buildUrl + "/Build.framework.js",

      codeUrl: buildUrl + "/Build.wasm",

      streamingAssetsUrl: "StreamingAssets",

      fullscreenElementID: "unity-fullscreen-container",

      companyName: "DefaultCompany",
      productName: "ShrinkingArena",
      productVersion: "1.0",

      showBanner: unityShowBanner
    };

    // Mobile device settings
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");

      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, " +
        "initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document.head.appendChild(meta);

      document.querySelector("#unity-container").className =
        "unity-mobile";

      canvas.className = "unity-mobile";

    } else {
      // Desktop game window
      fullscreenContainer.style.width = "960px";
      fullscreenContainer.style.height = "600px";
    }

    // Load Unity WebGL
    var script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {
      const loadingContainer =
        document.querySelector("#unity-loading-container");

      const progressBarFull =
        document.querySelector("#unity-progress-bar-full");

      createUnityInstance(canvas, config, (progress) => {
        if (progress < 1) {
          loadingContainer.style.display = "block";
          progressBarFull.style.width =
            100 * progress + "%";
        } else {
          loadingContainer.style.display = "none";
        }

      }).then((unityInstance) => {

        document.querySelector(
          "#unity-fullscreen-button"
        ).onclick = () => {
          unityInstance.SetFullscreen(1);
        };

      }).catch((message) => {
        unityShowBanner(message, "error");
        console.error("Unity WebGL Error:", message);
      });
    };

    script.onerror = () => {
      unityShowBanner(
        "Failed to load Unity WebGL loader.",
        "error"
      );
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
