
<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ZeldaTutorial | Unity WebGL</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #151515;
    }

    #unity-container.unity-desktop {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      transform: none !important;
      width: min(960px, 100%) !important;
      margin: 24px auto;
    }

    #unity-fullscreen-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
    }

    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #unity-container.unity-desktop #unity-canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #unity-footer {
      position: relative;
    }

    #unity-fullscreen-container:fullscreen {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
    }

    #unity-fullscreen-container:fullscreen #unity-canvas {
      width: min(100vw, 133.333vh) !important;
      height: auto !important;
      aspect-ratio: 4 / 3;
    }

    @media (max-width: 960px) {
      #unity-container.unity-desktop {
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">

    <div id="unity-fullscreen-container">

      <canvas
        id="unity-canvas"
        width="960"
        height="720"
        tabindex="-1">
      </canvas>

      <div id="unity-loading-container">
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
      </div>

    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">ZeldaTutorial</div>
    </div>

  </div>

  <script>
    const canvas = document.querySelector("#unity-canvas");
    const fullscreenContainer =
      document.querySelector("#unity-fullscreen-container");

    function unityShowBanner(msg, type) {
      const warningBanner =
        document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      const div = document.createElement("div");
      div.textContent = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style.cssText =
          "background:red;padding:10px;color:white;";
      } else {
        div.style.cssText =
          "background:yellow;padding:10px;color:black;";

        setTimeout(() => {
          div.remove();
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    const buildUrl = "Build";

    const loaderUrl =
      buildUrl + "/ZeldaWebGL_NoCompression.loader.js";

    const config = {
      arguments: [],

      dataUrl:
        buildUrl + "/ZeldaWebGL_NoCompression.data",

      frameworkUrl:
        buildUrl + "/ZeldaWebGL_NoCompression.framework.js",

      codeUrl:
        buildUrl + "/ZeldaWebGL_NoCompression.wasm",

      streamingAssetsUrl: "StreamingAssets",

      fullscreenElementID: "unity-fullscreen-container",

      companyName: "DefaultCompany",
      productName: "ZeldaTutorial",
      productVersion: "1.0",

      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      const meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content =
        "width=device-width, initial-scale=1, user-scalable=no";

      document.head.appendChild(meta);
    }

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      const loadingContainer =
        document.querySelector("#unity-loading-container");

      const progressBarFull =
        document.querySelector("#unity-progress-bar-full");

      createUnityInstance(canvas, config, (progress) => {
        if (progress < 1) {
          loadingContainer.style.display = "block";
          progressBarFull.style.width =
            (progress * 100) + "%";
        } else {
          loadingContainer.style.display = "none";
        }
      })
      .then((unityInstance) => {
        document.querySelector(
          "#unity-fullscreen-button"
        ).onclick = () => {
          unityInstance.SetFullscreen(1);
        };
      })
      .catch((message) => {
        alert(message);
      });
    };

    script.onerror = () => {
      unityShowBanner(
        "Failed to load the Unity WebGL loader.",
        "error"
      );
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
